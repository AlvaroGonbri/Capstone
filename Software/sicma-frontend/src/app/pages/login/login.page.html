<ion-content>
  <app-pantalla-ingreso titulo="Ingresar">
  <div class="ingreso">

    <!-- App móvil: ingreso con la huella o el PIN del teléfono -->
    @if (huella(); as nombre) {
      <ion-button expand="block" class="ingreso__huella" (click)="entrarConHuella()" [disabled]="cargando()">
        <ion-icon slot="start" name="finger-print-outline" aria-hidden="true"></ion-icon>
        Entrar con huella o PIN
      </ion-button>
      <p class="ingreso__huella-nota">Como {{ nombre }} · o ingresa con tu contraseña</p>
    }

    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <ion-list lines="full">
        <ion-item>
          <ion-input
            id="identificador"
            label="Usuario o correo"
            labelPlacement="stacked"
            type="text"
            autocomplete="username"
            formControlName="identificador"
            placeholder="usuario o usuario@dominio.cl"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            id="clave"
            label="Clave"
            labelPlacement="stacked"
            type="password"
            autocomplete="current-password"
            formControlName="clave"
          >
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>
      </ion-list>

      @if (error()) {
        <ion-text color="danger">
          <p class="ingreso__error" role="alert">{{ error() }}</p>
        </ion-text>
      }

      <ion-button
        type="submit"
        expand="block"
        class="ion-margin-top"
        [disabled]="cargando()"
      >
        @if (cargando()) {
          <ion-spinner name="dots" aria-label="Verificando"></ion-spinner>
        } @else {
          Entrar
        }
      </ion-button>
    </form>

    <ion-button fill="clear" expand="block" routerLink="/recuperar">
      ¿Olvidaste tu contraseña?
    </ion-button>
    <ion-button fill="clear" expand="block" size="small" routerLink="/cambiar-clave">
      Cambiar mi contraseña
    </ion-button>

    <ion-note class="ingreso__ayuda">
      Usa las credenciales de tu cuenta SICMA.
    </ion-note>
  </div>
  </app-pantalla-ingreso>
</ion-content>
