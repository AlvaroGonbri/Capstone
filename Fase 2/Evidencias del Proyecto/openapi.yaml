      type: apiKey
      in: header
      name: X-Device-Key
      description: Clave del dispositivo (sensor o agente del lector)
    puntoAcceso:
      type: apiKey
      in: header
      name: X-Punto-Acceso
      description: Id del punto de acceso del agente del lector
    zabbixToken:
      type: apiKey
      in: header
      name: X-Zabbix-Token
      description: Secreto compartido con Zabbix
  responses:
    Validacion:
      description: Datos no válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'
    NoAutenticado:
      description: Falta el token o no es válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol no tiene permiso, o el token es de solo lectura y la operación escribe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: El estado actual no permite la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Mensaje para la persona usuaria
      description: Error simple. Los errores de validación devuelven un objeto con un arreglo de mensajes por campo.
    ErrorValidacion:
      type: object
      properties: {}
      description: Objeto cuyas claves son los campos con error y cuyos valores son arreglos de mensajes. Un error general
        usa la clave detail o non_field_errors.
      additionalProperties:
        oneOf:
        - type: array
          items:
            type: string
        - type: string
    TokenRequest:
      type: object
      properties:
        username:
          type: string
          description: Correo o nombre de usuario
        password:
          type: string
          format: password
        canal:
          type: string
          enum:
          - web
          - movil
          default: web
          description: Con 'movil' el token emitido es de solo lectura (RF-PLT-02)
      required:
      - username
      - password
    TokenResponse:
      type: object
      properties:
        access:
          type: string
          description: JWT de acceso
        refresh:
          type: string
          description: JWT de refresco
      required:
      - access
      - refresh
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    RefreshResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
          description: Solo si la rotación de tokens está activa
      required:
      - access
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
          format: password
          minLength: 8
      required:
      - uid
      - token
      - new_password
    PasswordChange:
      type: object
      properties:
        username:
          type: string
          description: Correo o nombre de usuario
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
      required:
      - username
      - current_password
      - new_password
    PasswordPolicy:
      type: object
      properties:
        max_age_days:
          type: integer
          minimum: 0
          maximum: 365
          description: Vigencia máxima de las contraseñas en días. 0 es sin expiración
      required:
      - max_age_days
    SessionTimeout:
      type: object
      properties:
        inactivity_timeout_minutes:
          type: integer
          minimum: 1
          maximum: 120
    Me:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        nombre:
          type: string
        rol:
          type: string
          enum:
          - administrador
          - administradorprivilegiado
          - jefatura
          - tecnico
          - auditor
          - contratistas
          description: Rol único de la cuenta
        inactivity_timeout_minutes:
          type: integer
    ManagedUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        rol:
          type: string
          enum:
          - administrador
          - administradorprivilegiado
          - jefatura
          - tecnico
          - auditor
          - contratistas
          nullable: true
        inactivity_timeout_minutes:
          type: integer
          minimum: 1
          maximum: 120
        password_never_expires:
          type: boolean
        password_changed_at:
          type: string
          format: date-time
          nullable: true
        password_expires_at:
          type: string
          format: date-time
          nullable: true
        password_expired:
          type: boolean
    ManagedUserWrite:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        role:
          type: string
          enum:
          - Administrador
          - AdministradorPrivilegiado
          - Jefatura
          - Tecnico
          - Auditor
          - Contratistas
          description: Rol a asignar. Reemplaza al anterior
        password:
          type: string
          format: password
          description: Obligatoria al crear
        inactivity_timeout_minutes:
          type: integer
          minimum: 1
          maximum: 120
          description: Solo el Administrador Privilegiado puede cambiarla
        password_never_expires:
          type: boolean
          description: Solo el Administrador Privilegiado puede cambiarla
      required:
      - username
      - role
    Ubicacion:
      type: object
      properties:
        id:
          type: integer
        sala:
          type: string
        zona:
          type: string
          nullable: true
        rack:
          type: string
          nullable: true
        posicion:
          type: string
          nullable: true
        ubicacion_padre_id:
          type: integer
          nullable: true
        activa:
          type: boolean
    UbicacionWrite:
      type: object
      properties:
        sala:
          type: string
          maxLength: 100
        zona:
          type: string
          maxLength: 100
          nullable: true
        rack:
          type: string
          maxLength: 100
          nullable: true
        posicion:
          type: string
          maxLength: 100
          nullable: true
        ubicacion_padre:
          type: integer
          description: Id de la ubicación padre; debe estar activa
          nullable: true
        activa:
          type: boolean
          description: false desactiva; falla si tiene sensores activos, activos sin retirar o hijas activas
      required:
      - sala
    Medicion:
      type: object
      properties:
        id:
          type: integer
        sensor:
          type: integer
        evento_id:
          type: string
          format: uuid
        temperatura:
          type: number
          format: decimal
          description: Grados Celsius, entre -40 y 80
          nullable: true
        humedad:
          type: number
          format: decimal
          description: Porcentaje, entre 0 y 100
          nullable: true
        fecha_hora_medicion:
          type: string
          format: date-time
        fecha_hora_recepcion:
          type: string
          format: date-time
        origen:
          type: string
          enum:
          - Real
          - Simulado
    MedicionPagina:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Medicion'
    MedicionIngest:
      type: object
      properties:
        sensor_codigo:
          type: string
          maxLength: 50
        evento_id:
          type: string
          format: uuid
          description: Identificador único del envío. Reintentar con el mismo id no duplica la lectura
        temperatura:
          type: number
          nullable: true
        humedad:
          type: number
          nullable: true
        fecha_hora_medicion:
          type: string
          format: date-time
      required:
      - sensor_codigo
      - evento_id
      - fecha_hora_medicion
      description: Debe traer temperatura, humedad o ambas.
    MedicionIngestRespuesta:
      type: object
      properties:
        id:
          type: integer
        evento_id:
          type: string
        duplicate:
          type: boolean
      required:
      - id
      - evento_id
      - duplicate
    Sensor:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        tipo:
          type: string
        estado:
          type: string
          enum:
          - Activo
          - Inactivo
        intervalo_esperado_segundos:
          type: integer
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        ultima_medicion:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Medicion'
    SensorWrite:
      type: object
      properties:
        codigo:
          type: string
          maxLength: 50
          description: No se puede cambiar después del alta
        tipo:
          type: string
          maxLength: 100
        ubicacion:
          type: integer
          description: Id de una ubicación activa
        estado:
          type: string
          enum:
          - Activo
          - Inactivo
        intervalo_esperado_segundos:
          type: integer
          minimum: 1
          maximum: 86400
      required:
      - codigo
      - tipo
      - ubicacion
      - intervalo_esperado_segundos
    SensorCreado:
      allOf:
      - $ref: '#/components/schemas/Sensor'
      - type: object
        properties:
          clave_dispositivo:
            type: string
            description: Se muestra una sola vez; SICMA guarda solo su hash
    ClaveSensor:
      type: object
      properties:
        codigo:
          type: string
        clave_dispositivo:
          type: string
    Umbral:
      type: object
      properties:
        id:
          type: integer
        ubicacion:
          type: integer
        variable:
          type: string
          enum:
          - Temperatura
          - Humedad
        valor_minimo:
          type: number
        valor_maximo:
          type: number
        version:
          type: integer
        vigente_desde:
          type: string
          format: date-time
    UmbralWrite:
      type: object
      properties:
        ubicacion:
          type: integer
        variable:
          type: string
          enum:
          - Temperatura
          - Humedad
        valor_minimo:
          type: number
        valor_maximo:
          type: number
          description: 'Mayor que el mínimo. Temperatura: -40 a 80. Humedad: 0 a 100'
      required:
      - ubicacion
      - variable
      - valor_minimo
      - valor_maximo
    Activo:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        nombre:
          type: string
        tipo:
          type: string
          nullable: true
        marca:
          type: string
          nullable: true
        modelo:
          type: string
          nullable: true
        numero_serie:
          type: string
          nullable: true
        estado:
          type: string
        criticidad:
          type: string
          enum:
          - Baja
          - Media
          - Alta
          - Critica
        ubicacion:
          type: integer
        ubicacion_nombre:
          type: string
        responsable:
          type: integer
          nullable: true
        responsable_nombre:
          type: string
          nullable: true
        responsable_email:
          type: string
          nullable: true
        fecha_alta:
          type: string
          format: date-time
        observaciones:
          type: string
          nullable: true
    ActivoWrite:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        tipo:
          type: string
          description: Nombre de un tipo activo del catálogo
          nullable: true
        marca:
          type: string
          nullable: true
        modelo:
          type: string
          nullable: true
        numero_serie:
          type: string
          nullable: true
        estado:
          type: string
          description: Nombre de un estado activo del catálogo. 'Retirado' solo lo asigna un Administrador
        criticidad:
          type: string
          enum:
          - Baja
          - Media
          - Alta
          - Critica
        ubicacion:
          type: integer
          description: Id de una ubicación activa
        responsable:
          type: integer
          description: Id de un usuario activo
          nullable: true
        observaciones:
          type: string
          nullable: true
      required:
      - codigo
      - nombre
      - ubicacion
    HistorialActivo:
      type: object
      properties:
        id:
          type: integer
        campo_modificado:
          type: string
        valor_anterior:
          type: string
          nullable: true
        valor_nuevo:
          type: string
          nullable: true
        usuario_nombre:
          type: string
          nullable: true
        fecha_hora:
          type: string
          format: date-time
    TipoActivo:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        activo:
          type: boolean
    EstadoActivo:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
