openapi: 3.0.3
info:
  title: SICMA API
  version: 1.0.0
  description: 'API REST del backend de SICMA (Sistema Integrado de Control y Monitoreo de Activos), un monolito Django con
    Django REST Framework. Todo el tráfico es JSON.


    **Autenticación.** Las personas usan un token JWT en la cabecera Authorization: Bearer. Se obtiene en /api/auth/token/
    con el canal web, o con el canal movil para un token de solo lectura. Hay tres canales de máquina: los sensores ESP32-S3
    (cabecera X-Device-Key y código del sensor en el cuerpo), el agente del lector SecuGen (cabeceras X-Punto-Acceso y X-Device-Key)
    y el webhook de Zabbix (cabecera X-Zabbix-Token).


    **Roles.** Cada cuenta tiene exactamente un rol: Administrador, Administrador Privilegiado, Jefatura, Técnico, Auditor
    o Contratistas. La autorización se comprueba en cada endpoint y los roles permitidos están en su descripción. La aplicación
    móvil usa un token de solo lectura: toda escritura responde 403, salvo el cierre de sesión y el registro de actividad.


    **Sesión.** Un token se puede renovar mientras no pase el tiempo de inactividad de la cuenta (15 minutos por defecto).
    La contraseña puede expirar y entonces el inicio de sesión responde 403 con code password_expired. Tras 5 contraseñas
    incorrectas seguidas la cuenta se bloquea 15 minutos.


    **Límites de uso.** Por IP real (CF-Connecting-IP detrás del túnel de Cloudflare): 10 por minuto en el inicio de sesión
    y el cambio de contraseña, y 3 por hora en la recuperación de contraseña. Se responde 429 al superarlos.


    **Canal de correo con Power Automate.** Las solicitudes de intervención y las decisiones de la Jefatura no entran por
    esta API. Con la licencia gratuita de Power Automate no hay conectores HTTP, así que el flujo escribe un correo y SICMA
    lee su buzón por IMAP cada minuto. El asunto lleva la etiqueta [SICMA-INT] y el cuerpo es un JSON con el tipo "nueva"
    (forms_id, correo, nombre, rack, fecha, hora, hora_termino, descripcion, plan_reversa, servicios) o el tipo "decision"
    (forms_id, decision, decisor, comentario), más un token compartido. Solo se aceptan los correos del remitente configurado.


    **Convenciones.** Los recursos con historial no se eliminan: se desactivan o se retiran. Las fechas van en ISO 8601 y
    SICMA las guarda en UTC. Las claves de dispositivos se entregan una sola vez al crearlas y SICMA guarda solo su hash.'
  contact:
    name: Equipo SICMA, Duoc UC Plaza Oeste
servers:
- url: https://api.sicma.cl
  description: Publicación por Cloudflare Tunnel
- url: http://localhost:8000
  description: Desarrollo local
tags:
- name: Autenticación
  description: Sesión, contraseñas y cuentas de usuario
- name: Monitoreo ambiental
  description: Dispositivos IoT, lecturas, ubicaciones y umbrales
- name: Inventario
  description: Activos, su historial y los catálogos de tipos y estados
- name: Alertas
  description: Alertas y responsables de alerta por zona
- name: Infraestructura
  description: Estado de servidores y clúster según Zabbix
- name: Intervenciones
  description: Ciclo de vida de las intervenciones
- name: Control de acceso
  description: Personal externo, puntos de acceso, permisos y registro de accesos
- name: Agente del lector
  description: Endpoints que usa el agente del lector SecuGen
security:
- bearerAuth: []
paths:
  /api/auth/token/:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      operationId: post_api_auth_token
      description: Entrega el par de tokens JWT. Se puede entrar con el correo o con el nombre de usuario. Con canal movil
        el token es de solo lectura. Límite de 10 intentos por minuto por IP; tras 5 contraseñas incorrectas seguidas la cuenta
        se bloquea 15 minutos (403 account_locked). Si la contraseña expiró responde 403 con code password_expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      security: []
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '403':
          description: Cuenta bloqueada, contraseña expirada o rol no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/token/refresh/:
    post:
      tags:
      - Autenticación
      summary: Renovar el token de acceso
      operationId: post_api_auth_token_refresh
      description: Falla si la sesión superó su tiempo de inactividad o si la contraseña expiró.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Token inválido, sesión expirada por inactividad o usuario inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La contraseña expiró
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/Validacion'
  /api/auth/logout/:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión
      operationId: post_api_auth_logout
      description: Invalida el token de refresco (lista negra). También lo puede usar un token de solo lectura.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/auth/me/:
    get:
      tags:
      - Autenticación
      summary: Datos de la cuenta actual
      operationId: get_api_auth_me
      description: Incluye el rol único y el tiempo de inactividad.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cuenta actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/auth/activity/:
    post:
      tags:
      - Autenticación
      summary: Registrar actividad
      operationId: post_api_auth_activity
      description: Renueva la marca de última actividad para el cierre por inactividad. Sin cuerpo.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Actividad registrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/auth/password-reset/:
    post:
      tags:
      - Autenticación
      summary: Pedir recuperación de contraseña
      operationId: post_api_auth_password_reset
      description: Envía un correo con el enlace si la cuenta existe. La respuesta es la misma exista o no. Límite de 3 por
        hora por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      security: []
      responses:
        '202':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/Validacion'
  /api/auth/password-reset/confirm/:
    post:
      tags:
      - Autenticación
      summary: Confirmar recuperación de contraseña
      operationId: post_api_auth_password_reset_confirm
      description: Los parámetros uid y token vienen del enlace del correo y se pueden enviar en el cuerpo o en la consulta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      security: []
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/Validacion'
  /api/auth/password-change/:
    post:
      tags:
      - Autenticación
      summary: Cambiar la contraseña con la clave actual
      operationId: post_api_auth_password_change
      description: 'No exige sesión: sirve cuando la contraseña expiró. Cuenta para el bloqueo por intentos fallidos. Límite
        de 10 por minuto por IP.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      security: []
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cuenta bloqueada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/Validacion'
  /api/auth/password-policy/:
    get:
      tags:
      - Autenticación
      summary: Ver la vigencia de contraseñas
      operationId: get_api_auth_password_policy
      x-roles:
      - administrador
      - administradorprivilegiado
      description: 'Roles: Administrador, Administrador Privilegiado.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    patch:
      tags:
      - Autenticación
      summary: Cambiar la vigencia de contraseñas
      operationId: patch_api_auth_password_policy
      x-roles:
      - administradorprivilegiado
      description: 'Solo el Administrador Privilegiado cambia la política; un Administrador recibe 403. Roles: Administrador
        Privilegiado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Política actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/auth/users/:
    get:
      tags:
      - Autenticación
      summary: Listar cuentas
      operationId: get_api_auth_users
      x-roles:
      - administrador
      - administradorprivilegiado
      description: 'Roles: Administrador, Administrador Privilegiado.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cuentas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedUser'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
      - Autenticación
      summary: Crear una cuenta
      operationId: post_api_auth_users
      x-roles:
      - administrador
      - administradorprivilegiado
      description: 'Un Administrador no puede crear cuentas de administración ni fijar la inactividad ni la vigencia de la
        contraseña: eso es del Administrador Privilegiado. Roles: Administrador, Administrador Privilegiado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedUserWrite'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/auth/users/{user_id}/:
    patch:
      tags:
      - Autenticación
      summary: Editar una cuenta
      operationId: patch_api_auth_users_user_id
      x-roles:
      - administrador
      - administradorprivilegiado
      description: 'Cambia datos, rol o contraseña, o desactiva la cuenta. Las cuentas de administración solo las modifica
        un Administrador Privilegiado. Roles: Administrador, Administrador Privilegiado.'
      parameters:
      - name: user_id
        in: path
        required: true
        description: Id del usuario
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedUserWrite'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cuenta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /api/auth/users/{user_id}/session-timeout/:
    patch:
      tags:
      - Autenticación
      summary: Cambiar el tiempo de inactividad de una cuenta
      operationId: patch_api_auth_users_user_id_session_timeout
      x-roles:
      - administradorprivilegiado
      description: 'Solo el Administrador Privilegiado. De 1 a 120 minutos. Roles: Administrador Privilegiado.'
      parameters:
      - name: user_id
        in: path
        required: true
        description: Id del usuario
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTimeout'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Tiempo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTimeout'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /api/mediciones/:
    post:
      tags:
      - Monitoreo ambiental
      summary: Enviar una lectura (dispositivo IoT)
      operationId: post_api_mediciones
      description: El ESP32-S3 se identifica con el código del sensor en el cuerpo y su clave en la cabecera X-Device-Key.
        Reenviar el mismo evento_id no duplica la lectura. Al crear una lectura nueva se evalúa contra los umbrales y puede
        abrir una alerta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicionIngest'
      security:
      - deviceKey: []
      responses:
        '201':
          description: Lectura creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicionIngestRespuesta'
        '200':
          description: La lectura ya existía (duplicate true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicionIngestRespuesta'
        '401':
          description: Credenciales del dispositivo no válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/Validacion'
    get:
      tags:
      - Monitoreo ambiental
      summary: Consultar lecturas
      operationId: get_api_mediciones
      x-roles:
      - administrador
      - administradorprivilegiado
      - jefatura
      - tecnico
      - auditor
      description: 'Paginado de 100 por página (máximo 500 con page_size). Roles: Administrador, Administrador Privilegiado,
        Jefatura, Técnico, Auditor.'
      parameters:
      - name: sensor
        in: query
        required: false
        description: Id del sensor
        schema:
          type: integer
      - name: desde
        in: query
        required: false
        description: Medición desde
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        required: false
        description: Medición hasta
        schema:
          type: string
          format: date-time
      - name: recibido_desde
        in: query
        required: false
        description: Recibidas después de esta fecha
        schema:
          type: string
          format: date-time
      - name: origen
        in: query
        required: false
        description: Origen
        schema:
          type: string
          enum:
          - Real
          - Simulado
      - name: ordering
        in: query
        required: false
        description: Orden
        schema:
          type: string
          enum:
          - fecha_hora_medicion
          - -fecha_hora_medicion
          default: fecha_hora_medicion
      - name: page
        in: query
        required: false
        description: Número de página
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: Tamaño de página
        schema:
          type: integer
          maximum: 500
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Página de lecturas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicionPagina'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/sensores/:
    get:
      tags:
      - Monitoreo ambiental
      summary: Listar dispositivos
      operationId: get_api_sensores
      x-roles:
      - administrador
      - administradorprivilegiado
      - jefatura
      - tecnico
      - auditor
      description: 'Incluye la última lectura de cada uno. Roles: Administrador, Administrador Privilegiado, Jefatura, Técnico,
        Auditor.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dispositivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
      - Monitoreo ambiental
      summary: Registrar un dispositivo
      operationId: post_api_sensores
      x-roles:
      - administrador
      - administradorprivilegiado
      description: 'Entrega la clave del dispositivo una sola vez. Roles: Administrador, Administrador Privilegiado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorWrite'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Dispositivo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorCreado'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /api/sensores/{id}/:
    get:
      tags:
      - Monitoreo ambiental
      summary: Ver un dispositivo
      operationId: get_api_sensores_id
      x-roles:
      - administrador
      - administradorprivilegiado
      - jefatura
      - tecnico
      - auditor
      description: 'Roles: Administrador, Administrador Privilegiado, Jefatura, Técnico, Auditor.'
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags:
      - Monitoreo ambiental
      summary: Editar o desactivar un dispositivo
      operationId: patch_api_sensores_id
      x-roles:
      - administrador
      - administradorprivilegiado
      description: 'Desactivar es estado Inactivo. El código no cambia. Roles: Administrador, Administrador Privilegiado.'
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorWrite'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dispositivo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /api/sensores/{id}/clave/:
    post:
      tags:
      - Monitoreo ambiental
      summary: Generar una clave nueva para el dispositivo
      operationId: post_api_sensores_id_clave
      x-roles:
      - administrador
      - administradorprivilegiado
      description: 'La clave anterior deja de funcionar de inmediato. Sin cuerpo. Roles: Administrador, Administrador Privilegiado.'
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Clave nueva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaveSensor'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /api/ubicaciones/:
    get:
      tags:
      - Monitoreo ambiental
      summary: Listar ubicaciones y zonas
      operationId: get_api_ubicaciones
      x-roles:
      - administrador
      - administradorprivilegiado
      - jefatura
      - tecnico
      - auditor
      description: 'Por defecto solo las activas. Roles: Administrador, Administrador Privilegiado, Jefatura, Técnico, Auditor.'
      parameters:
      - name: todas
        in: query
        required: false
        description: Con 1 incluye las desactivadas
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Ubicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ubicacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
      - Monitoreo ambiental
      summary: Crear una ubicación o zona
