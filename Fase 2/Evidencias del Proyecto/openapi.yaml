        etiqueta:
          type: string
        color:
          type: string
          enum:
          - primary
          - secondary
          - tertiary
          - success
          - warning
          - danger
          - medium
          - dark
        activo:
          type: boolean
        es_sistema:
          type: boolean
          readOnly: true
        orden:
          type: integer
      required:
      - nombre
    UsuarioResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        email:
          type: string
          nullable: true
    Alerta:
      type: object
      properties:
        id:
          type: integer
        origen:
          type: string
          enum:
          - IoT
          - Biometria
          - Zabbix
        condicion:
          type: string
        severidad:
          type: string
          enum:
          - Informativa
          - Advertencia
          - Alta
          - Critica
        estado:
          type: string
          enum:
          - Nueva
          - Reconocida
          - Cerrada
        fecha_apertura:
          type: string
          format: date-time
        contador_ocurrencias:
          type: integer
        fecha_ultima_ocurrencia:
          type: string
          format: date-time
        sensor_codigo:
          type: string
          nullable: true
        ubicacion:
          type: integer
          nullable: true
        evento_zabbix:
          type: string
          nullable: true
        ultima_gestion:
          type: object
          properties:
            accion:
              type: string
              enum:
              - Reconocida
              - Cerrada
            usuario:
              type: string
              nullable: true
            comentario:
              type: string
            fecha_hora:
              type: string
              format: date-time
          nullable: true
    GestionAlerta:
      type: object
      properties:
        comentario:
          type: string
          maxLength: 255
          default: ''
    ResponsablesZona:
      type: object
      properties:
        ubicacion:
          type: integer
        correos:
          type: array
          items:
